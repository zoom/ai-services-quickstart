services:
  - type: web
    name: ai-services-quickstart
    runtime: node
    buildCommand: npm ci --include=dev && npm ci --prefix playground --include=dev && npm run build && npm run build --prefix playground
    startCommand: npm run start:compiled
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ZOOM_API_KEY
        sync: false
      - key: ZOOM_API_SECRET
        sync: false
    # Add optional AWS_* credentials and WEBHOOK_SECRET in the service dashboard.
